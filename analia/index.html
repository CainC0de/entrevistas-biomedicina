<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dra. Analia Cerqueira Mihomem</title><link rel="stylesheet" href="../style.css"><body class="viewer"><main><img id="page" src="1.webp" alt="Dra. Analia Cerqueira Mihomem Biomédica, doutora em patologia, responsável técnica pelo laboratório de Análises clínicas do Hospital Municipal de Goiatuba"></main><nav aria-label="Paginação"><button id="prev" disabled>Anterior</button><output aria-live="polite">1 de 5</output><button id="next">Próxima</button></nav><script id="texts" type="application/json">["Dra. Analia Cerqueira Mihomem Biomédica, doutora em patologia, responsável técnica pelo laboratório de Análises clínicas do Hospital Municipal de Goiatuba", "Análises Clínicas. 1. Quais exames laboratoriais podem ajudar a avaliar as alterações metabólicas de pacientes que utilizam Mounjaro ou Ozempic? Acho que os principais exames são glicemia de jejum, hemoglobina glicada, insulina de jejum e HOMA-IR, porque ajudam a avaliar o metabolismo da glicose e a resistência à insulina. Também é interessante acompanhar o perfil lipídico, as enzimas hepáticas e a função renal. Com esses exames conseguimos observar como o organismo está respondendo ao tratamento e se estão acontecendo mudanças importantes no perfil metabólico do paciente.", "Análises Clínicas. 2. Quais marcadores laboratoriais podem ser relevantes para investigar a relação entre metabolismo e saúde reprodutiva? Além dos exames metabólicos, podemos avaliar alguns hormônios, como LH, FSH, estradiol, progesterona, testosterona, SHBG e AMH nas mulheres. Nos homens, podemos avaliar principalmente testosterona, LH, FSH e estradiol. Esses marcadores ajudam a entender como está o funcionamento hormonal e se existem alterações que possam estar relacionadas à função reprodutiva. É importante lembrar que precisam ser interpretados considerando o contexto de cada paciente.", "Análises Clínicas. 3. Como os resultados dos exames podem contribuir para compreender as mudanças metabólicas observadas durante o tratamento? Os exames permitem acompanhar o paciente antes e durante o tratamento e observar se houve melhora da glicemia, da resistência à insulina e do perfil lipídico. Quando essas mudanças acontecem junto com alterações hormonais, podemos começar a entender melhor como a melhora metabólica pode repercutir na saúde reprodutiva. Mas precisamos ter cuidado para não dizer que uma coisa causou a outra, porque existem vários mecanismos envolvidos.", "Análises Clínicas. 4. Quais são as limitações dos exames laboratoriais para estabelecer uma relação entre esses medicamentos e a fertilidade? A principal limitação é que os exames mostram alguns parâmetros do organismo, mas não conseguem explicar sozinhos todos os mecanismos envolvidos. Por exemplo, se uma mulher apresenta melhora hormonal depois de emagrecer utilizando esses medicamentos, não conseguimos afirmar se isso aconteceu por uma ação direta do medicamento ou pela própria perda de peso e melhora da resistência à insulina. Para entender essa diferença, precisamos de estudos mais aprofundados, principalmente envolvendo análises moleculares e modelos experimentais."]</script><script src="../viewer.js"></script></body></html>
