<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dra. Ludmilla Terra Borges</title><link rel="stylesheet" href="../style.css"><body class="viewer"><main><img id="page" src="1.webp" alt="Dra. Ludmilla Terra Borges Biomédica, especializada em Reprodução Humana"></main><nav aria-label="Paginação"><button id="prev" disabled>Anterior</button><output aria-live="polite">1 de 5</output><button id="next">Próxima</button></nav><script id="texts" type="application/json">["Dra. Ludmilla Terra Borges Biomédica, especializada em Reprodução Humana", "Reprodução Humana. 1. Como as alterações metabólicas e a resistência à insulina podem influenciar a ovulação e a fertilidade? A resistência à insulina pode interferir bastante na função reprodutiva. Nas mulheres, por exemplo, o excesso de insulina pode estimular a produção de andrógenos pelos ovários, alterando o desenvolvimento dos folículos e dificultando a ovulação. Isso é muito observado em mulheres com síndrome dos ovários policísticos. Nos homens, a obesidade e as alterações metabólicas também podem prejudicar a produção hormonal e a qualidade dos espermatozoides. Então, existe uma relação muito importante entre metabolismo e reprodução.", "Reprodução Humana. 2. A perda de peso associada ao tratamento pode melhorar a função reprodutiva em algumas pessoas? Em quais situações? Sim! Principalmente em pessoas com obesidade, resistência à insulina e mulheres com síndrome dos ovários policísticos. Quando acontece a perda de peso, pode haver uma melhora da sensibilidade à insulina e do perfil hormonal, favorecendo a regularização do ciclo menstrual e até a recuperação da ovulação. Mas é importante destacar que isso pode acontecer como consequência da melhora metabólica, e não necessariamente porque o medicamento age diretamente nos ovários.", "Reprodução Humana. 3. Quais são as principais atividades e responsabilidades de um biomédico na sua área? Na reprodução humana, o biomédico pode atuar em diferentes etapas dos processos laboratoriais relacionados à reprodução assistida. Isso inclui análise do sêmen, avaliação e seleção de espermatozoides, processamento de gametas, criopreservação e atuação em técnicas de reprodução assistida, de acordo com sua habilitação. Também existe uma atuação muito importante na pesquisa científica, investigando os mecanismos celulares e moleculares envolvidos na fertilidade e no desenvolvimento embrionário.", "Reprodução Humana. 4. Quais cuidados são importantes para quem utiliza esses medicamentos e pretende engravidar? O principal é conversar com o médico antes de começar a tentar engravidar, porque esses medicamentos não devem ser utilizados durante a gestação. A semaglutida, por exemplo, deve ser suspensa pelo menos dois meses antes de uma gravidez planejada. Para a tirzepatida, o planejamento da suspensão também precisa ser discutido com o médico. Outro ponto importante é que a perda de peso pode favorecer o retorno da ovulação, principalmente em mulheres com SOP, então é necessário ter atenção à contracepção durante o tratamento."]</script><script src="../viewer.js"></script></body></html>
