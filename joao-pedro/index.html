<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dr. João Pedro Torres Guimarães</title><link rel="stylesheet" href="../style.css"><body class="viewer"><main><img id="page" src="1.webp" alt="Dr. João Pedro Torres Guimarães Biomédico, mestre em Patologia Tropical e Saúde Pública com ênfase em imunologia. Doutor em Imunologia pela USP. Atualmente trabalha na Merck uma das maiores empresas de insumos e tecnologia para análises moleculares."></main><nav aria-label="Paginação"><button id="prev" disabled>Anterior</button><output aria-live="polite">1 de 5</output><button id="next">Próxima</button></nav><script id="texts" type="application/json">["Dr. João Pedro Torres Guimarães Biomédico, mestre em Patologia Tropical e Saúde Pública com ênfase em imunologia. Doutor em Imunologia pela USP. Atualmente trabalha na Merck uma das maiores empresas de insumos e tecnologia para análises moleculares.", "Biologia Molecular. 1. Quais mecanismos moleculares e hormonais ajudam a explicar a relação entre obesidade, resistência à insulina e alteração na função reprodutiva? A obesidade não provoca apenas o acúmulo de gordura, ela também modifica o funcionamento do tecido adiposo, que produz várias substâncias capazes de interferir no metabolismo e na regulação hormonal. Podemos citar a leptina, a adiponectina e algumas citocinas inflamatórias, como TNF- alfa e IL-6. Essas alterações podem favorecer a resistência à insulina e interferir no eixo hipotálamo-hipófise-gonadal. Nas mulheres, por exemplo, o aumento da insulina pode estimular a produção de andrógenos pelos ovários, prejudicando o desenvolvimento folicular e a ovulação.", "Biologia Molecular. 2. Quais mecanismos moleculares relacionam a sinalização hormonal, o metabolismo da glicose e a função reprodutiva? Existem várias vias envolvidas nessa comunicação. Podemos destacar a PI3K/AKT, que participa da sinalização da insulina e do metabolismo da glicose, a AMPK, que funciona como um sensor energético da célula, e a mTOR, que participa da regulação do crescimento e do metabolismo celular. Também temos a sinalização da leptina e do GLP-1, que fazem essa integração entre o estado energético do organismo e diferentes respostas hormonais. O interessante é que essas vias não funcionam isoladamente, existe uma comunicação entre o sistema nervoso central, o pâncreas e os órgãos reprodutivos.", "Biologia Molecular. 3. Como pesquisas moleculares podem ajudar a investigar possíveis efeitos desses medicamentos sobre os processos reprodutivos? As pesquisas moleculares podem ajudar a entender se esses medicamentos têm algum efeito direto sobre estruturas relacionadas à reprodução ou se as mudanças observadas acontecem principalmente por causa do emagrecimento e da melhora metabólica. Podemos investigar a expressão de receptores de GLP-1 e GIP, alterações na expressão de genes relacionados à produção hormonal e a ativação de vias como PI3K/AKT e AMPK. Também podemos estudar células ovarianas e testiculares em modelos experimentais. Isso ajuda a entender melhor o que está acontecendo em nível celular, algo que não conseguimos observar apenas com exames laboratoriais convencionais.", "Biologia Molecular. 4. Quais são as limitações dos estudos moleculares para concluir se um medicamento causa alterações na fertilidade humana? A principal questão é que encontrar uma alteração molecular não significa necessariamente que ela vai provocar uma mudança na fertilidade. Podemos identificar a presença de um receptor ou uma alteração em determinada via de sinalização, mas isso não comprova que exista um efeito funcional no organismo. Além disso, muitos estudos são realizados em animais ou culturas celulares, e os resultados nem sempre podem ser reproduzidos em seres humanos. Por isso, precisamos combinar os resultados experimentais com estudos clínicos para conseguir chegar a conclusões mais seguras."]</script><script src="../viewer.js"></script></body></html>
