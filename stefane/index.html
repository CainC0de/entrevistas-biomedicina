<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dra. Stefane Madalena Marques</title><link rel="stylesheet" href="../style.css"><body class="viewer"><main><img id="page" src="1.webp" alt="Dra. Stefane Madalena Marques Mestre em Ciências Biólogicas, Doutora em Ciências Fisiológicas. Atualmente é professora de medicina na Universidade Federal de Catalão e participa de pesquisas científicas na área de hipertensão cardiovascular, epidemiologia de doenças crônicas não transmissíveis, regulação neuro cardiovascular e neuro comportamental."></main><nav aria-label="Paginação"><button id="prev" disabled>Anterior</button><output aria-live="polite">1 de 5</output><button id="next">Próxima</button></nav><script id="texts" type="application/json">["Dra. Stefane Madalena Marques Mestre em Ciências Biólogicas, Doutora em Ciências Fisiológicas. Atualmente é professora de medicina na Universidade Federal de Catalão e participa de pesquisas científicas na área de hipertensão cardiovascular, epidemiologia de doenças crônicas não transmissíveis, regulação neuro cardiovascular e neuro comportamental.", "Pesquisa Científica. 1. Quais evidências científicas existem atualmente sobre a relação entre o uso desses medicamentos e a fertilidade? Já existem estudos mostrando que os agonistas de GLP-1 podem melhorar alguns parâmetros relacionados à função reprodutiva, principalmente em mulheres com obesidade e síndrome dos ovários policísticos. Alguns trabalhos mostram melhora da resistência à insulina, regularização do ciclo menstrual e recuperação da ovulação. Porém, grande parte desses estudos envolve medicamentos como liraglutida e exenatida. Ainda temos poucos dados específicos sobre semaglutida e tirzepatida. Então, não podemos afirmar que esses medicamentos aumentam diretamente a fertilidade. O que temos são resultados promissores que ainda precisam ser investigados.", "Pesquisa Científica. 2. Como diferenciar uma associação observada entre emagrecimento e gravidez de uma relação de causa e efeito provocada pelo medicamento? Essa é uma das questões mais difíceis. Se uma mulher utiliza o medicamento, perde peso e depois engravida, não podemos concluir automaticamente que o medicamento aumentou sua fertilidade. Ela pode ter apresentado uma melhora da resistência à insulina e do perfil hormonal em consequência do emagrecimento, o que favoreceu o retorno da ovulação. Também existe a possibilidade de algum efeito farmacológico direto, mas ainda precisamos investigar melhor. Como são muitos mecanismos acontecendo ao mesmo tempo, é difícil separar essas respostas apenas em estudos com pacientes. Por isso, os modelos experimentais são importantes para investigar essas vias de maneira mais controlada.", "Pesquisa Científica. 3. Quais tipos de estudos são necessários para investigar possíveis efeitos desses medicamentos na saúde reprodutiva? Acredito que precisamos trabalhar com diferentes tipos de estudos. Os estudos clínicos são importantes para acompanhar os pacientes e observar alterações hormonais, metabólicas e reprodutivas ao longo do tratamento. Já os estudos experimentais permitem investigar os mecanismos envolvidos, utilizando modelos animais e culturas celulares. Também seriam importantes estudos longitudinais e ensaios clínicos que avaliassem desfechos como ovulação, qualidade dos gametas, gravidez e nascimento vivo. O ideal seria conseguir integrar essas diferentes abordagens para entender tanto o que acontece no organismo quanto os mecanismos responsáveis por essas alterações.", "Pesquisa Científica. 4. Quais são as principais lacunas científicas sobre esse tema e o que ainda precisa ser pesquisado? Acho que a principal lacuna é justamente entender se esses medicamentos possuem algum efeito direto sobre a função reprodutiva ou se os resultados observados são consequência da perda de peso e da melhora metabólica. Ainda precisamos de mais estudos específicos sobre semaglutida e tirzepatida, avaliando possíveis efeitos sobre os ovários, testículos, qualidade dos gametas e desenvolvimento embrionário. Também precisamos de estudos que acompanhem os pacientes por mais tempo e avaliem os resultados reprodutivos de fato, não apenas alterações hormonais. É um campo de pesquisa muito interessante e que ainda tem muitas perguntas sem resposta."]</script><script src="../viewer.js"></script></body></html>
