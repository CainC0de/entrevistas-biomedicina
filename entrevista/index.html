<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrevistas completas</title><link rel="stylesheet" href="../style.css"><body class="viewer"><main><img id="page" src="1.webp" alt="Dra Analia Cerqueira Milhomem Biomédica, doutora em Patologia, responsável técnica pelo laboratório de Análises Clínicas do Hospital Municipal de Goiatuba. 1. Análises Clínicas 1. Quais exames laboratoriais podem ajudar a avaliar as alterações metabólicas de pacientes que utilizam Mounjaro ou Ozempic? Acho que os principais exames são glicemia de jejum, hemoglobina glicada, insulina de jejum e HOMA-IR, porque ajudam a avaliar o metabolismo da glicose e a resistência à insulina. Também é interessante acompanhar o perfil lipídico, as enzimas hepáticas e a função renal. Com esses exames conseguimos observar como o organismo está respondendo ao tratamento e se estão acontecendo mudanças importantes no perfil metabólico do paciente. 2. Quais marcadores laboratoriais podem ser relevantes para investigar a relação entre metabolismo e saúde reprodutiva? Além dos exames metabólicos, podemos avaliar alguns hormônios, como LH, FSH, estradiol, progesterona, testosterona, SHBG e AMH nas mulheres. Nos homens, podemos avaliar principalmente testosterona, LH, FSH e estradiol. Esses marcadores ajudam a entender como está o funcionamento hormonal e se existem alterações que possam estar relacionadas à função reprodutiva. É importante lembrar que precisam ser interpretados considerando o contexto de cada paciente. 3. Como os resultados dos exames podem contribuir para compreender as mudanças metabólicas observadas durante o tratamento? Os exames permitem acompanhar o paciente antes e durante o tratamento e observar se houve melhora da glicemia, da resistência à insulina e do perfil lipídico. Quando essas mudanças acontecem junto com alterações hormonais, podemos começar a entender melhor como a melhora metabólica pode repercutir na saúde reprodutiva. Mas precisamos ter cuidado para não dizer que uma coisa causou a outra, porque existem vários mecanismos envolvidos."></main><nav aria-label="Paginação"><button id="prev" disabled>Anterior</button><output aria-live="polite">1 de 6</output><button id="next">Próxima</button></nav><script id="texts" type="application/json">["Dra Analia Cerqueira Milhomem Biomédica, doutora em Patologia, responsável técnica pelo laboratório de Análises Clínicas do Hospital Municipal de Goiatuba. 1. Análises Clínicas 1. Quais exames laboratoriais podem ajudar a avaliar as alterações metabólicas de pacientes que utilizam Mounjaro ou Ozempic? Acho que os principais exames são glicemia de jejum, hemoglobina glicada, insulina de jejum e HOMA-IR, porque ajudam a avaliar o metabolismo da glicose e a resistência à insulina. Também é interessante acompanhar o perfil lipídico, as enzimas hepáticas e a função renal. Com esses exames conseguimos observar como o organismo está respondendo ao tratamento e se estão acontecendo mudanças importantes no perfil metabólico do paciente. 2. Quais marcadores laboratoriais podem ser relevantes para investigar a relação entre metabolismo e saúde reprodutiva? Além dos exames metabólicos, podemos avaliar alguns hormônios, como LH, FSH, estradiol, progesterona, testosterona, SHBG e AMH nas mulheres. Nos homens, podemos avaliar principalmente testosterona, LH, FSH e estradiol. Esses marcadores ajudam a entender como está o funcionamento hormonal e se existem alterações que possam estar relacionadas à função reprodutiva. É importante lembrar que precisam ser interpretados considerando o contexto de cada paciente. 3. Como os resultados dos exames podem contribuir para compreender as mudanças metabólicas observadas durante o tratamento? Os exames permitem acompanhar o paciente antes e durante o tratamento e observar se houve melhora da glicemia, da resistência à insulina e do perfil lipídico. Quando essas mudanças acontecem junto com alterações hormonais, podemos começar a entender melhor como a melhora metabólica pode repercutir na saúde reprodutiva. Mas precisamos ter cuidado para não dizer que uma coisa causou a outra, porque existem vários mecanismos envolvidos.", "4. Quais são as limitações dos exames laboratoriais para estabelecer uma relação entre esses medicamentos e a fertilidade? A principal limitação é que os exames mostram alguns parâmetros do organismo, mas não conseguem explicar sozinhos todos os mecanismos envolvidos. Por exemplo, se uma mulher apresenta melhora hormonal depois de emagrecer utilizando esses medicamentos, não conseguimos afirmar se isso aconteceu por uma ação direta do medicamento ou pela própria perda de peso e melhora da resistência à insulina. Para entender essa diferença, precisamos de estudos mais aprofundados, principalmente envolvendo análises moleculares e modelos experimentais. Dra Ludmilla Terra Borges Biomédica, especializada em Reprodução Humana. 2. Reprodução Humana 1. Como as alterações metabólicas e a resistência à insulina podem influenciar a ovulação e a fertilidade? A resistência à insulina pode interferir bastante na função reprodutiva. Nas mulheres, por exemplo, o excesso de insulina pode estimular a produção de andrógenos pelos ovários, alterando o desenvolvimento dos folículos e dificultando a ovulação. Isso é muito observado em mulheres com síndrome dos ovários policísticos. Nos homens, a obesidade e as alterações metabólicas também podem prejudicar a produção hormonal e a qualidade dos espermatozoides. Então, existe uma relação muito importante entre metabolismo e reprodução. 2. A perda de peso associada ao tratamento pode melhorar a função reprodutiva em algumas pessoas? Em quais situações? Sim! Principalmente em pessoas com obesidade, resistência à insulina e mulheres com síndrome dos ovários policísticos. Quando acontece a perda de peso, pode haver uma melhora da sensibilidade à insulina e do perfil hormonal,", "favorecendo a regularização do ciclo menstrual e até a recuperação da ovulação. Mas é importante destacar que isso pode acontecer como consequência da melhora metabólica, e não necessariamente porque o medicamento age diretamente nos ovários. 3. Quais são as principais atividades e responsabilidades de um biomédico na sua área? Na reprodução humana, o biomédico pode atuar em diferentes etapas dos processos laboratoriais relacionados à reprodução assistida. Isso inclui análise do sêmen, avaliação e seleção de espermatozoides, processamento de gametas, criopreservação e atuação em técnicas de reprodução assistida, de acordo com sua habilitação. Também existe uma atuação muito importante na pesquisa científica, investigando os mecanismos celulares e moleculares envolvidos na fertilidade e no desenvolvimento embrionário. 4. Quais cuidados são importantes para quem utiliza esses medicamentos e pretende engravidar? O principal é conversar com o médico antes de começar a tentar engravidar, porque esses medicamentos não devem ser utilizados durante a gestação. A semaglutida, por exemplo, deve ser suspensa pelo menos dois meses antes de uma gravidez planejada. Para a tirzepatida, o planejamento da suspensão também precisa ser discutido com o médico. Outro ponto importante é que a perda de peso pode favorecer o retorno da ovulação, principalmente em mulheres com SOP, então é necessário ter atenção à contracepção durante o tratamento. Dr João Pedro Torres Guimarães biomédico, mestre em Patologia Tropical e Saúde Pública com ênfase em imunologia. Doutor em Imunologia pela USP. Atualmente trabalha na Merck uma das maiores empresas de insumos e tecnologia para análises moleculares. 3. Biologia Molecular 1. Quais mecanismos moleculares e hormonais ajudam a explicar a relação entre obesidade, resistência à insulina e alteração na função reprodutiva?", "A obesidade não provoca apenas o acúmulo de gordura, ela também modifica o funcionamento do tecido adiposo, que produz várias substâncias capazes de interferir no metabolismo e na regulação hormonal. Podemos citar a leptina, a adiponectina e algumas citocinas inflamatórias, como TNF-alfa e IL-6. Essas alterações podem favorecer a resistência à insulina e interferir no eixo hipotálamo-hipófise-gonadal. Nas mulheres, por exemplo, o aumento da insulina pode estimular a produção de andrógenos pelos ovários, prejudicando o desenvolvimento folicular e a ovulação. 2. Quais mecanismos moleculares relacionam a sinalização hormonal, o metabolismo da glicose e a função reprodutiva? Existem várias vias envolvidas nessa comunicação. Podemos destacar a PI3K/AKT, que participa da sinalização da insulina e do metabolismo da glicose, a AMPK, que funciona como um sensor energético da célula, e a mTOR, que participa da regulação do crescimento e do metabolismo celular. Também temos a sinalização da leptina e do GLP-1, que fazem essa integração entre o estado energético do organismo e diferentes respostas hormonais. O interessante é que essas vias não funcionam isoladamente, existe uma comunicação entre o sistema nervoso central, o pâncreas e os órgãos reprodutivos. 3. Como pesquisas moleculares podem ajudar a investigar possíveis efeitos desses medicamentos sobre os processos reprodutivos? As pesquisas moleculares podem ajudar a entender se esses medicamentos têm algum efeito direto sobre estruturas relacionadas à reprodução ou se as mudanças observadas acontecem principalmente por causa do emagrecimento e da melhora metabólica. Podemos investigar a expressão de receptores de GLP-1 e GIP, alterações na expressão de genes relacionados à produção hormonal e a ativação de vias como PI3K/AKT e AMPK. Também podemos estudar células ovarianas e testiculares em modelos experimentais. Isso ajuda a entender melhor o que está acontecendo em nível celular, algo que não conseguimos observar apenas com exames laboratoriais convencionais. 4. Quais são as limitações dos estudos moleculares para concluir se um medicamento causa alterações na fertilidade humana? A principal questão é que encontrar uma alteração molecular não significa necessariamente que ela vai provocar uma mudança na fertilidade. Podemos identificar a presença de um receptor ou uma alteração em determinada via de sinalização, mas isso não comprova que exista um efeito funcional no organismo. Além disso, muitos estudos são realizados em animais ou culturas celulares, e os resultados nem sempre podem ser reproduzidos em seres humanos. Por isso, precisamos combinar os resultados experimentais com estudos clínicos para conseguir chegar a conclusões mais seguras.", "Dra. Stefane Madalena Marques Mestre em Ciências Biólogicas, Doutora em Ciências Fisiológicas. Atualmente é professora de medicina na Universidade Federal de Catalão e participa de pesquisas científicas na área de hipertensão cardiovascular, epidemiologia de doenças crônicas não transmissíveis, regulação neuro cardiovascular e neurocomportamental. 4. Pesquisa Científica 1. Quais evidências científicas existem atualmente sobre a relação entre o uso desses medicamentos e a fertilidade? Já existem estudos mostrando que os agonistas de GLP-1 podem melhorar alguns parâmetros relacionados à função reprodutiva, principalmente em mulheres com obesidade e síndrome dos ovários policísticos. Alguns trabalhos mostram melhora da resistência à insulina, regularização do ciclo menstrual e recuperação da ovulação. Porém, grande parte desses estudos envolve medicamentos como liraglutida e exenatida. Ainda temos poucos dados específicos sobre semaglutida e tirzepatida. Então, não podemos afirmar que esses medicamentos aumentam diretamente a fertilidade. O que temos são resultados promissores que ainda precisam ser investigados. 2. Como diferenciar uma associação observada entre emagrecimento e gravidez de uma relação de causa e efeito provocada pelo medicamento? Essa é uma das questões mais difíceis. Se uma mulher utiliza o medicamento, perde peso e depois engravida, não podemos concluir automaticamente que o medicamento aumentou sua fertilidade. Ela pode ter apresentado uma melhora da resistência à insulina e do perfil hormonal em consequência do emagrecimento, o que favoreceu o retorno da ovulação. Também existe a possibilidade de algum efeito farmacológico direto, mas ainda precisamos investigar melhor. Como são muitos mecanismos acontecendo ao mesmo tempo, é difícil separar essas respostas apenas em estudos com pacientes. Por isso, os modelos experimentais são importantes para investigar essas vias de maneira mais controlada.", "3. Quais tipos de estudos são necessários para investigar possíveis efeitos desses medicamentos na saúde reprodutiva? Acredito que precisamos trabalhar com diferentes tipos de estudos. Os estudos clínicos são importantes para acompanhar os pacientes e observar alterações hormonais, metabólicas e reprodutivas ao longo do tratamento. Já os estudos experimentais permitem investigar os mecanismos envolvidos, utilizando modelos animais e culturas celulares. Também seriam importantes estudos longitudinais e ensaios clínicos que avaliassem desfechos como ovulação, qualidade dos gametas, gravidez e nascimento vivo. O ideal seria conseguir integrar essas diferentes abordagens para entender tanto o que acontece no organismo quanto os mecanismos responsáveis por essas alterações. 4. Quais são as principais lacunas científicas sobre esse tema e o que ainda precisa ser pesquisado? Acho que a principal lacuna é justamente entender se esses medicamentos possuem algum efeito direto sobre a função reprodutiva ou se os resultados observados são consequência da perda de peso e da melhora metabólica. Ainda precisamos de mais estudos específicos sobre semaglutida e tirzepatida, avaliando possíveis efeitos sobre os ovários, testículos, qualidade dos gametas e desenvolvimento embrionário. Também precisamos de estudos que acompanhem os pacientes por mais tempo e avaliem os resultados reprodutivos de fato, não apenas alterações hormonais. É um campo de pesquisa muito interessante e que ainda tem muitas perguntas sem resposta."]</script><script src="../viewer.js"></script></body></html>
